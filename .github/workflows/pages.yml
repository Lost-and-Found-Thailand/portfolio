name: Deploy Pages

on:
  push:
    branches: [liam-digital-brand-kit]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r site dist/site
          cp -r brand-kit dist/brand-kit
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=site/index.html">
          <link rel="canonical" href="site/index.html">
          <p><a href="site/index.html">Continue to the site</a></p>
          EOF

      - name: Cache-bust CSS/JS
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          find dist/site -name "*.html" -print0 | xargs -0 sed -i \
            -e "s|assets/main.css\"|assets/main.css?v=${SHORT_SHA}\"|g" \
            -e "s|assets/main.js\"|assets/main.js?v=${SHORT_SHA}\"|g"
          # main.css itself @imports brand-kit/tokens.css by a fixed URL, so a
          # browser that already cached that response keeps using it forever --
          # the ?v= above only forces a refetch of main.css, not its @import.
          sed -i "s|brand-kit/tokens.css\")|brand-kit/tokens.css?v=${SHORT_SHA}\")|g" dist/site/assets/main.css

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
